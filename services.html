<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBR ERP — Services</title><link rel="stylesheet" href="shared.css"></head>
<body>
<div id="sidebar-wrap"></div><div id="topbar-wrap"></div>
<div class="main">
  <div class="page-hdr"><div class="page-title">🔧 Services</div><button class="btn btn-p" onclick="openForm()">+ Add Service</button></div>
  <input class="search-bar" id="search" placeholder="Search services..." oninput="render()" style="max-width:320px;margin-bottom:16px">
  <div id="list" class="list-wrap"></div>
</div>
<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal" style="max-width:500px">
    <div class="modal-hdr"><div class="modal-title" id="modal-title">+ Add Service</div><button onclick="document.getElementById('modal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button></div>
    <div class="field"><label class="flbl">Service Name *</label><input class="fi" id="svc-name"></div>
    <div class="field"><label class="flbl">Description</label><textarea class="fi" id="svc-desc" rows="2"></textarea></div>
    <div class="fg3">
      <div class="field"><label class="flbl">Unit Price (AED)</label><input class="fi" id="svc-price" type="number" min="0" step="0.01"></div>
      <div class="field"><label class="flbl">Default Qty</label><input class="fi" id="svc-qty" type="number" min="1" value="1"></div>
      <div class="field"><label class="flbl">VAT %</label><input class="fi" id="svc-vat" type="number" value="5"></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn" onclick="document.getElementById('modal').style.display='none'">Cancel</button>
      <button class="btn btn-p" onclick="save()">💾 Save</button>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
let editId=null;
async function main(){const ok=await initPage('services','Services');if(ok)render();}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const list=SBR.services.filter(s=>!q||(s.name||'').toLowerCase().includes(q));
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-state-icon">🔧</div><div class="empty-state-text">No services yet.</div></div>';return;}
  el.innerHTML=`<table class="tbl"><thead><tr><th>Service Name</th><th>Description</th><th>Unit Price</th><th>Default Qty</th><th>VAT</th><th>Actions</th></tr></thead><tbody>`+
  list.map(s=>`<tr onclick="openForm(${s.id})" style="cursor:pointer">
    <td style="font-weight:600">${escH(s.name)}</td>
    <td style="font-size:11px;color:var(--text2)">${escH(s.desc||'—')}</td>
    <td style="font-weight:700;color:var(--blue)">AED ${fmt(s.price||0)}</td>
    <td>${s.defQty||1}</td>
    <td>${s.vat||5}%</td>
    <td><div style="display:flex;gap:4px">
      <button class="btn btn-xs btn-p" onclick="event.stopPropagation();openForm(${s.id})">✏️</button>
      <button class="btn btn-xs btn-r" onclick="event.stopPropagation();del(${s.id})">✕</button>
    </div></td>
  </tr>`).join('')+'</tbody></table>';
}
function openForm(id){
  editId=id||null;
  if(id){const s=SBR.services.find(x=>x.id===id);if(!s)return;document.getElementById('modal-title').textContent='✏️ Edit Service';sv('svc-name',s.name);sv('svc-desc',s.desc||'');sv('svc-price',s.price||0);sv('svc-qty',s.defQty||1);sv('svc-vat',s.vat||5);}
  else{document.getElementById('modal-title').textContent='+ Add Service';['svc-name','svc-desc'].forEach(i=>sv(i,''));sv('svc-price',0);sv('svc-qty',1);sv('svc-vat',5);}
  document.getElementById('modal').style.display='flex';
}
function save(){
  const name=gv('svc-name').trim();if(!name){showToast('Name required','error');return;}
  const obj={name,desc:gv('svc-desc'),price:parseFloat(gv('svc-price'))||0,defQty:parseInt(gv('svc-qty'))||1,vat:parseFloat(gv('svc-vat'))||5};
  if(editId){const s=SBR.services.find(x=>x.id===editId);if(s)Object.assign(s,obj);}
  else SBR.services.push({id:SBR.svcIdCtr++,...obj});
  saveAllData();document.getElementById('modal').style.display='none';render();showToast('✅ Saved!');
}
function del(id){if(!confirm('Delete?'))return;SBR.services=SBR.services.filter(x=>x.id!==id);saveAllData();render();}
main();
</script>
</body>
</html>
