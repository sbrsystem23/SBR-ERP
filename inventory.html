<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBR ERP — Inventory</title><link rel="stylesheet" href="shared.css"></head>
<body>
<div id="sidebar-wrap"></div><div id="topbar-wrap"></div>
<div class="main">
  <div class="page-hdr"><div class="page-title">🗃️ Inventory</div><button class="btn btn-p" onclick="openForm()">+ Add Item</button></div>
  <input class="search-bar" id="search" placeholder="Search inventory..." oninput="render()" style="max-width:320px;margin-bottom:16px">
  <div id="list" class="list-wrap"></div>
</div>
<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal" style="max-width:500px">
    <div class="modal-hdr"><div class="modal-title" id="modal-title">+ Add Item</div><button onclick="document.getElementById('modal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button></div>
    <div class="fg2">
      <div class="field"><label class="flbl">Item Name *</label><input class="fi" id="inv-name"></div>
      <div class="field"><label class="flbl">Unit</label><input class="fi" id="inv-unit" placeholder="pcs, m, kg..."></div>
    </div>
    <div class="fg3">
      <div class="field"><label class="flbl">Current Qty</label><input class="fi" id="inv-qty" type="number" min="0"></div>
      <div class="field"><label class="flbl">Min Qty</label><input class="fi" id="inv-min" type="number" min="0"></div>
      <div class="field"><label class="flbl">Unit Cost (AED)</label><input class="fi" id="inv-cost" type="number" min="0" step="0.01"></div>
    </div>
    <div class="field"><label class="flbl">Location / Notes</label><input class="fi" id="inv-notes"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn" onclick="document.getElementById('modal').style.display='none'">Cancel</button>
      <button class="btn btn-p" onclick="save()">💾 Save</button>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
window.addEventListener("load",function(){main();});
let editId=null;
async function main(){const ok=await initPage('inventory','Inventory');if(ok)render();}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const list=SBR.inventory.filter(i=>!q||(i.name||'').toLowerCase().includes(q));
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-state-icon">🗃️</div><div class="empty-state-text">No inventory items yet.</div></div>';return;}
  el.innerHTML=`<table class="tbl"><thead><tr><th>Item</th><th>Qty</th><th>Min Qty</th><th>Unit</th><th>Unit Cost</th><th>Status</th><th>Actions</th></tr></thead><tbody>`+
  list.map(i=>{
    const low=i.qty<=i.min;
    return`<tr onclick="openForm(${i.id})" style="cursor:pointer">
      <td><div style="font-weight:600">${escH(i.name)}</div>${i.notes?`<div style="font-size:10px;color:var(--text2)">${escH(i.notes)}</div>`:''}</td>
      <td style="font-size:14px;font-weight:700;color:${low?'#dc2626':'var(--blue)'}">${i.qty||0}</td>
      <td style="color:var(--text2)">${i.min||0}</td>
      <td>${escH(i.unit||'pcs')}</td>
      <td>AED ${fmt(i.cost||0)}</td>
      <td>${low?'<span style="background:#fee2e2;color:#dc2626;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600">⚠️ Low Stock</span>':'<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600">✅ OK</span>'}</td>
      <td><div style="display:flex;gap:4px">
        <button class="btn btn-xs btn-p" onclick="event.stopPropagation();openForm(${i.id})">✏️</button>
        <button class="btn btn-xs btn-r" onclick="event.stopPropagation();del(${i.id})">✕</button>
      </div></td>
    </tr>`;
  }).join('')+'</tbody></table>';
}
function openForm(id){
  editId=id||null;
  if(id){const i=SBR.inventory.find(x=>x.id===id);if(!i)return;document.getElementById('modal-title').textContent='✏️ Edit Item';sv('inv-name',i.name);sv('inv-unit',i.unit||'');sv('inv-qty',i.qty||0);sv('inv-min',i.min||0);sv('inv-cost',i.cost||0);sv('inv-notes',i.notes||'');}
  else{document.getElementById('modal-title').textContent='+ Add Item';['inv-name','inv-unit','inv-notes'].forEach(x=>sv(x,''));sv('inv-qty',0);sv('inv-min',0);sv('inv-cost',0);}
  document.getElementById('modal').style.display='flex';
}
function save(){
  const name=gv('inv-name').trim();if(!name){showToast('Name required','error');return;}
  const obj={name,unit:gv('inv-unit'),qty:parseFloat(gv('inv-qty'))||0,min:parseFloat(gv('inv-min'))||0,cost:parseFloat(gv('inv-cost'))||0,notes:gv('inv-notes')};
  if(editId){const i=SBR.inventory.find(x=>x.id===editId);if(i)Object.assign(i,obj);}
  else SBR.inventory.push({id:SBR.stkIdCtr++,...obj});
  saveAllData();document.getElementById('modal').style.display='none';render();showToast('✅ Saved!');
}
function del(id){if(!confirm('Delete?'))return;SBR.inventory=SBR.inventory.filter(x=>x.id!==id);saveAllData();render();}
</script>
</body>
</html>
