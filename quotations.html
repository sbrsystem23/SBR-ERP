<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBR ERP — Quotations</title><link rel="stylesheet" href="shared.css"></head>
<body>
<div id="sidebar-wrap"></div><div id="topbar-wrap"></div>
<div class="main">
  <div class="page-hdr"><div class="page-title">📄 Quotations</div><button class="btn btn-p" onclick="openForm()">+ New Quotation</button></div>
  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <input class="search-bar" id="search" placeholder="Search quotations..." oninput="render()" style="max-width:280px">
    <select class="fi" id="status-filter" onchange="render()" style="max-width:160px"><option value="">All Status</option><option>Estimate</option><option>Sent</option><option>Under Discussion</option><option>Approved</option><option>Rejected</option></select>
  </div>
  <div id="list" class="list-wrap"></div>
</div>
<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal" style="max-width:680px">
    <div class="modal-hdr"><div class="modal-title" id="modal-title">+ New Quotation</div><button onclick="document.getElementById('modal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button></div>
    <div class="fg2">
      <div class="field"><label class="flbl">Quotation No.</label><input class="fi" id="qf-num"></div>
      <div class="field"><label class="flbl">Date</label><input class="fi" id="qf-date" type="date"></div>
    </div>
    <div class="fg2">
      <div class="field"><label class="flbl">Client *</label><select class="fi" id="qf-client"><option value="">— Select —</option></select></div>
      <div class="field"><label class="flbl">Status</label><select class="fi" id="qf-status"><option>Estimate</option><option>Sent</option><option>Under Discussion</option><option>Approved</option><option>Rejected</option></select></div>
    </div>
    <div class="fg2">
      <div class="field"><label class="flbl">Project Reference</label><input class="fi" id="qf-projref" placeholder="e.g. Villa 5, Al Barari"></div>
      <div class="field"><label class="flbl">Payment Terms</label><select class="fi" id="qf-terms"><option>100% Advance</option><option>50% Advance · 50% on Completion</option><option>30/40/30</option><option>As per LPO</option></select></div>
    </div>
    <div class="card-title" style="margin:10px 0 6px">📋 Systems / Sections</div>
    <div id="qt-systems"></div>
    <button class="btn btn-sm" onclick="addSystem()" style="margin:6px 0">+ Add Section</button>
    <div style="border-top:.5px solid var(--border);margin-top:10px;padding-top:10px;display:flex;justify-content:flex-end">
      <div style="width:260px">
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span style="color:var(--text2)">Subtotal (excl. VAT)</span><span id="qt-sub">AED 0.00</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span style="color:var(--text2)">VAT (5%)</span><span id="qt-vat">AED 0.00</span></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;font-weight:800;color:var(--blue);border-top:.5px solid var(--border);margin-top:4px"><span>GRAND TOTAL</span><span id="qt-total">AED 0.00</span></div>
      </div>
    </div>
    <div class="field"><label class="flbl">Notes</label><textarea class="fi" id="qf-notes" rows="2"></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn" onclick="document.getElementById('modal').style.display='none'">Cancel</button>
      <button class="btn btn-p" onclick="save()">💾 Save Quotation</button>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
window.addEventListener("load",function(){main();});
let editId=null,qtSystems=[];
async function main(){const ok=await initPage('quotations','Quotations');if(ok)render();}
function populateClients(){const sel=document.getElementById('qf-client');const cur=sel.value;sel.innerHTML='<option value="">— Select —</option>'+SBR.clients.map(c=>`<option value="${c.id}">${escH(c.name)}</option>`).join('');if(cur)sel.value=cur;}
function calcTotal(){let sub=0,vat=0;qtSystems.forEach(sys=>{(sys.items||[]).forEach(it=>{const n=(it.qty||0)*(it.price||0)*(1-(it.disc||0)/100);sub+=n;vat+=n*(it.vat||5)/100;});});document.getElementById('qt-sub').textContent='AED '+fmt(sub);document.getElementById('qt-vat').textContent='AED '+fmt(vat);document.getElementById('qt-total').textContent='AED '+fmt(sub+vat);return{sub,vat,total:sub+vat};}
function addSystem(){qtSystems.push({name:'System '+(qtSystems.length+1),items:[{desc:'',qty:1,price:0,disc:0,vat:5}]});renderSystems();}
function addItemToSystem(si){qtSystems[si].items.push({desc:'',qty:1,price:0,disc:0,vat:5});renderSystems();}
function renderSystems(){
  document.getElementById('qt-systems').innerHTML=qtSystems.map((sys,si)=>`
    <div style="border:.5px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden">
      <div style="background:var(--blue);padding:8px 12px;display:flex;align-items:center;gap:8px">
        <input value="${escH(sys.name)}" oninput="qtSystems[${si}].name=this.value" style="background:transparent;border:none;color:#fff;font-weight:700;font-size:13px;flex:1;outline:none">
        <button onclick="qtSystems.splice(${si},1);renderSystems()" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer">✕</button>
      </div>
      <div style="padding:10px">
        <div style="font-size:9px;color:var(--text2);display:grid;grid-template-columns:1fr 60px 80px 60px 60px auto;gap:4px;margin-bottom:6px;text-transform:uppercase;font-weight:700">
          <span>Description</span><span style="text-align:center">Qty</span><span style="text-align:right">Unit Price</span><span style="text-align:center">Disc%</span><span style="text-align:center">VAT%</span><span></span>
        </div>
        ${(sys.items||[]).map((it,ii)=>`<div style="display:grid;grid-template-columns:1fr 60px 80px 60px 60px auto;gap:4px;margin-bottom:4px;align-items:center">
          <input class="fi" value="${escH(it.desc)}" placeholder="Item description" oninput="qtSystems[${si}].items[${ii}].desc=this.value" style="font-size:11px;padding:5px 8px">
          <input class="fi" type="number" value="${it.qty}" min="0" oninput="qtSystems[${si}].items[${ii}].qty=parseFloat(this.value)||0;calcTotal()" style="text-align:center;font-size:11px;padding:5px 4px">
          <input class="fi" type="number" value="${it.price}" min="0" step="0.01" oninput="qtSystems[${si}].items[${ii}].price=parseFloat(this.value)||0;calcTotal()" style="text-align:right;font-size:11px;padding:5px 4px">
          <input class="fi" type="number" value="${it.disc||0}" min="0" max="100" oninput="qtSystems[${si}].items[${ii}].disc=parseFloat(this.value)||0;calcTotal()" style="text-align:center;font-size:11px;padding:5px 4px">
          <input class="fi" type="number" value="${it.vat||5}" min="0" oninput="qtSystems[${si}].items[${ii}].vat=parseFloat(this.value)||0;calcTotal()" style="text-align:center;font-size:11px;padding:5px 4px">
          <button onclick="qtSystems[${si}].items.splice(${ii},1);renderSystems()" style="background:#fee2e2;border:.5px solid #fca5a5;color:#dc2626;border-radius:4px;padding:3px 6px;cursor:pointer;font-size:10px">✕</button>
        </div>`).join('')}
        <button onclick="addItemToSystem(${si})" class="btn btn-xs" style="margin-top:4px">+ Item</button>
      </div>
    </div>`).join('');
  calcTotal();
}
function render(){
  const q=document.getElementById('search').value.toLowerCase();const sf=document.getElementById('status-filter').value;
  const list=SBR.savedQuotations.filter(qt=>(!q||(qt.num||'').toLowerCase().includes(qt.projectRef||'').toLowerCase()||(qt.num||'').toLowerCase().includes(q))&&(!sf||qt.status===sf)).sort((a,b)=>b.id-a.id);
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-state-icon">📄</div><div class="empty-state-text">No quotations yet.</div></div>';return;}
  el.innerHTML=`<table class="tbl"><thead><tr><th>Quotation No.</th><th>Client</th><th>Project Ref</th><th>Date</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>`+
  list.map(qt=>{const c=SBR.clients.find(x=>x.id===qt.clientId)||{name:'—'};return`<tr onclick="openForm(${qt.id})" style="cursor:pointer">
    <td style="font-weight:600;color:var(--blue)">${escH(qt.num||'—')}</td>
    <td>${escH(c.name)}</td>
    <td style="font-size:11px;color:var(--text2)">${escH(qt.projectRef||'—')}</td>
    <td>${formatDate(qt.date)}</td>
    <td style="font-weight:700;color:var(--blue)">AED ${fmt(qt.total||0)}</td>
    <td>${badgeHTML(qt.status)}</td>
    <td><div style="display:flex;gap:4px">
      <button class="btn btn-xs btn-p" onclick="event.stopPropagation();openForm(${qt.id})">✏️</button>
      <button class="btn btn-xs btn-r" onclick="event.stopPropagation();del(${qt.id})">✕</button>
    </div></td>
  </tr>`;}).join('')+'</tbody></table>';
}
function openForm(id){
  editId=id||null;populateClients();
  const num='QT-2026-0'+SBR.qtIdCtr;
  if(id){const qt=SBR.savedQuotations.find(x=>x.id===id);if(!qt)return;document.getElementById('modal-title').textContent='✏️ Edit Quotation';sv('qf-num',qt.num);sv('qf-date',qt.date);sv('qf-client',qt.clientId||'');sv('qf-status',qt.status||'Estimate');sv('qf-projref',qt.projectRef||'');sv('qf-terms',qt.terms||'');sv('qf-notes',qt.notes||'');qtSystems=JSON.parse(JSON.stringify(qt.systems||[]));}
  else{document.getElementById('modal-title').textContent='+ New Quotation';sv('qf-num',num);sv('qf-date',td());sv('qf-client','');sv('qf-status','Estimate');sv('qf-projref','');sv('qf-terms','');sv('qf-notes','');qtSystems=[{name:'System 1',items:[{desc:'',qty:1,price:0,disc:0,vat:5}]}];}
  renderSystems();document.getElementById('modal').style.display='flex';
}
function save(){
  const t=calcTotal();
  const obj={num:gv('qf-num')||'QT-2026-0'+SBR.qtIdCtr,date:gv('qf-date'),clientId:parseInt(gv('qf-client'))||null,status:gv('qf-status'),projectRef:gv('qf-projref'),terms:gv('qf-terms'),notes:gv('qf-notes'),systems:JSON.parse(JSON.stringify(qtSystems)),total:t.total,savedAt:td()};
  if(editId){const qt=SBR.savedQuotations.find(x=>x.id===editId);if(qt)Object.assign(qt,obj);}
  else SBR.savedQuotations.push({id:SBR.qtIdCtr++,...obj});
  saveAllData();document.getElementById('modal').style.display='none';render();showToast('✅ Quotation saved!');
}
function del(id){if(!confirm('Delete?'))return;SBR.savedQuotations=SBR.savedQuotations.filter(x=>x.id!==id);saveAllData();render();}
</script>
</body>
</html>
