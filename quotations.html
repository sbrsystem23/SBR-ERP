<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBR ERP — Quotations</title>
<link rel="stylesheet" href="shared.css">
<style>
.qview{display:none}.qview.active{display:block}
.list-tbl{width:100%;border-collapse:collapse;font-size:12px}
.list-tbl th{background:#f8fafc;padding:8px 10px;text-align:left;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border);font-weight:600}
.list-tbl td{padding:8px 10px;border-bottom:.5px solid var(--border)}
.list-tbl tr:hover td{background:#f8fafc}
.td-num{font-weight:600;color:var(--blue)}
.td-nowrap{white-space:nowrap}
.td-badge{text-align:center}
.td-act{text-align:right}
</style>
</head>
<body>
<div id="sidebar-wrap"></div>
<div id="topbar-wrap"></div>
<div class="qview active" id="view-list">
  <div class="main">
    <div class="page-hdr">
      <div class="page-title">📄 Quotations</div>
      <button class="btn btn-p" onclick="newQuotation()">+ New Quotation</button>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <input class="search-bar" id="ql-search" placeholder="Search quotations..." oninput="renderQuotList(this.value)" style="max-width:280px">
      <select class="fi" id="ql-status" onchange="renderQuotList()" style="max-width:160px">
        <option value="">All Status</option>
        <option>Estimate</option><option>Sent</option><option>Under Discussion</option>
        <option>Approved</option><option>Rejected</option><option>On Hold</option><option>Cancelled</option>
      </select>
    </div>
    <div id="quot-list-wrap"></div>
  </div>
</div>
<script src="shared.js"></script>
<script>
window.fmtNum=function(n,d){return Number(n||0).toLocaleString('en-AE',{minimumFractionDigits:d||2,maximumFractionDigits:d||2});};
window.fmtDate=function(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('en-AE',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}};
window.fmt=function(n){return fmtNum(n);};
window.colState={};
window.populateCatSelect=function(){};
window.refreshStatusSelects=function(){};
Object.defineProperties(window,{
  savedQuotations:{get:()=>SBR.savedQuotations,set:v=>SBR.savedQuotations=v},
  clients:{get:()=>SBR.clients},productDB:{get:()=>SBR.productDB},
  services:{get:()=>SBR.services},staff:{get:()=>SBR.staff},projects:{get:()=>SBR.projects},
  qtIdCtr:{get:()=>SBR.qtIdCtr,set:v=>SBR.qtIdCtr=v},
  quotGroupCtr:{get:()=>SBR.quotGroupCtr,set:v=>SBR.quotGroupCtr=v}
});
function nav(p){if(p==='quot-list')renderQuotList();}
function showPage(p){nav(p);}

function renderQuotList(q){
  var search=(q||gv('ql-search')||'').toLowerCase();
  var sf=gv('ql-status')||'';
  var wrap=document.getElementById('quot-list-wrap');if(!wrap)return;
  var list=SBR.savedQuotations.slice().sort(function(a,b){return b.id-a.id;});
  if(search)list=list.filter(function(qt){return(qt.num||'').toLowerCase().includes(search)||(clients.find(function(c){return c.id===qt.clientId;})||{name:''}).name.toLowerCase().includes(search);});
  if(sf)list=list.filter(function(qt){return qt.status===sf;});
  if(!list.length){wrap.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">No quotations found. <button class="btn btn-p" onclick="newQuotation()">+ New Quotation</button></div>';return;}
  var stC={Approved:'#dcfce7','Under Discussion':'#fef3c7',Sent:'#e0f2fe',Rejected:'#fee2e2','On Hold':'#ede9fe',Cancelled:'#f1f5f9'};
  var stT={Approved:'#166534','Under Discussion':'#92400e',Sent:'#0369a1',Rejected:'#dc2626','On Hold':'#7c3aed',Cancelled:'#6b7280'};
  wrap.innerHTML='<table class="list-tbl"><thead><tr><th>Quotation No.</th><th>Client</th><th>Project Ref</th><th class="td-nowrap">Date</th><th style="text-align:right">Total</th><th class="td-badge">Status</th><th class="td-act">Actions</th></tr></thead><tbody>'+
  list.map(function(qt,i){
    var c=clients.find(function(x){return x.id===qt.clientId;})||{name:qt.clientName||'—'};
    var bg=stC[qt.status]||'#f1f5f9';var tc=stT[qt.status]||'#374151';
    return'<tr style="background:'+(i%2===0?'#fff':'#fafafa')+'">' +
      '<td class="td-num">'+escH(qt.num||'')+'</td>'+
      '<td>'+escH(c.name)+'</td>'+
      '<td style="font-size:11px;color:var(--text2)">'+escH(qt.projectRef||'—')+'</td>'+
      '<td class="td-nowrap" style="font-size:11px">'+escH(qt.date||'—')+'</td>'+
      '<td style="text-align:right;font-weight:700;color:var(--blue)">AED '+fmtNum(qt.total||0)+'</td>'+
      '<td class="td-badge"><span style="background:'+bg+';color:'+tc+';padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600">'+escH(qt.status||'—')+'</span></td>'+
      '<td class="td-act" style="white-space:nowrap">'+
        '<button class="btn btn-xs btn-p" onclick="editQuot('+qt.id+')" style="margin-right:4px">✏️ Edit</button>'+
        '<button class="btn btn-xs" onclick="duplicateQt('+qt.id+')" style="margin-right:4px" title="Duplicate">⧉</button>'+
        '<button class="btn btn-xs btn-r" onclick="deleteQt('+qt.id+')">✕</button>'+
      '</td></tr>';
  }).join('')+'</tbody></table>';
}

function editQuot(id){
  var qt=SBR.savedQuotations.find(function(q){return q.id===id;});
  if(!qt)return;
  // Open in modal for now - full builder coming
  openQtModal(qt);
}

function newQuotation(){
  openQtModal(null);
}

function duplicateQt(id){
  var qt=SBR.savedQuotations.find(function(q){return q.id===id;});
  if(!qt)return;
  var copy=JSON.parse(JSON.stringify(qt));
  copy.id=SBR.qtIdCtr++;
  copy.num='QT-'+new Date().getFullYear()+'-'+String(copy.id).padStart(3,'0');
  copy.status='Estimate';copy.date=new Date().toISOString().split('T')[0];
  SBR.savedQuotations.push(copy);
  saveAllData();renderQuotList();showToast('✅ Duplicated: '+copy.num);
}

function deleteQt(id){
  if(!confirm('Delete this quotation?'))return;
  SBR.savedQuotations=SBR.savedQuotations.filter(function(q){return q.id!==id;});
  saveAllData();renderQuotList();showToast('Deleted');
}

// Simple modal editor
function openQtModal(qt){
  var isNew=!qt;
  if(isNew){qt={id:SBR.qtIdCtr++,num:'QT-'+new Date().getFullYear()+'-'+String(SBR.qtIdCtr).padStart(3,'0'),date:new Date().toISOString().split('T')[0],status:'Estimate',clientId:null,systems:[{id:1,name:'System 1',items:[],svcs:[]}],total:0};}
  var modal=document.getElementById('qt-modal');
  if(!modal){
    modal=document.createElement('div');modal.id='qt-modal';
    modal.className='modal-bg';modal.style.display='none';
    modal.onclick=function(e){if(e.target===modal)modal.style.display='none';};
    modal.innerHTML='<div class="modal" style="max-width:900px;max-height:90vh;overflow-y:auto"><div id="qt-modal-inner"></div></div>';
    document.body.appendChild(modal);
  }
  var clientOpts=SBR.clients.map(function(c){return'<option value="'+c.id+'"'+(c.id===qt.clientId?' selected':'')+'>'+escH(c.name)+'</option>';}).join('');
  var systemsHtml=qt.systems.map(function(sys,si){
    var itemsHtml=sys.items.map(function(item,ii){
      return'<div style="display:grid;grid-template-columns:40px 1fr 80px 80px 60px 30px;gap:6px;align-items:center;padding:4px 0;border-bottom:.5px solid #f0f0f0">'+
        '<span style="font-size:11px;color:var(--text2)">'+escH(item.num||'')+'</span>'+
        '<span style="font-size:12px">'+escH(item.name||'')+'</span>'+
        '<span style="font-size:11px;text-align:right">'+fmtNum(item.price||0)+'</span>'+
        '<span style="font-size:11px;text-align:center">×'+escH(String(item.qty||1))+'</span>'+
        '<span style="font-size:11px;text-align:center">'+escH(String(item.vat||5))+'%</span>'+
        '<button onclick="removeQtItem('+si+','+ii+')" style="background:none;border:none;cursor:pointer;color:#dc2626;font-size:14px">✕</button>'+
      '</div>';
    }).join('');
    var svcsHtml=sys.svcs.map(function(svc,svi){
      return'<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px">'+
        '<span style="flex:1">'+escH(svc.name||'')+'</span>'+
        '<span>AED '+fmtNum(svc.price||0)+'</span>'+
        '<button onclick="removeQtSvc('+si+','+svi+')" style="background:none;border:none;cursor:pointer;color:#dc2626">✕</button>'+
      '</div>';
    }).join('');
    return'<div style="border:.5px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
        '<input value="'+escH(sys.name||'')+'" onchange="window._qtEdit.systems['+si+'].name=this.value" style="flex:1;border:none;background:transparent;font-weight:700;font-size:13px;outline:none">'+
        (qt.systems.length>1?'<button onclick="removeQtSys('+si+')" style="background:none;border:none;cursor:pointer;color:#dc2626">✕ Remove</button>':'')+'</div>'+
      '<div style="font-size:11px;color:var(--text2);margin-bottom:4px">Products:</div>'+
      '<div id="qt-items-'+si+'">'+itemsHtml+'</div>'+
      '<div style="font-size:11px;color:var(--text2);margin:8px 0 4px">Services:</div>'+
      '<div id="qt-svcs-'+si+'">'+svcsHtml+'</div>'+
      '<div style="display:flex;gap:6px;margin-top:8px">'+
        '<button class="btn btn-xs" onclick="addQtItemManual('+si+')">+ Add Item</button>'+
        '<button class="btn btn-xs" onclick="addQtSvcManual('+si+')">+ Add Service</button>'+
      '</div>'+
    '</div>';
  }).join('');

  window._qtEdit=JSON.parse(JSON.stringify(qt));
  window._qtIsNew=isNew;

  document.getElementById('qt-modal-inner').innerHTML=
    '<div class="modal-hdr"><div class="modal-title">'+(isNew?'+ New Quotation':'✏️ Edit: '+escH(qt.num||''))+'</div>'+
    '<button onclick="document.getElementById('qt-modal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button></div>'+
    '<div class="fg2">'+
      '<div class="field"><label class="flbl">Quotation No.</label><input class="fi" id="qf-num" value="'+escH(qt.num||'')+'"></div>'+
      '<div class="field"><label class="flbl">Date</label><input class="fi" id="qf-date" type="date" value="'+escH(qt.date||'')+'"></div>'+
    '</div><div class="fg2">'+
      '<div class="field"><label class="flbl">Client *</label><select class="fi" id="qf-client"><option value="">— Select —</option>'+clientOpts+'</select></div>'+
      '<div class="field"><label class="flbl">Status</label><select class="fi" id="qf-status"><option>Estimate</option><option>Sent</option><option>Under Discussion</option><option>Approved</option><option>Rejected</option><option>On Hold</option></select></div>'+
    '</div><div class="field"><label class="flbl">Project Ref</label><input class="fi" id="qf-projref" value="'+escH(qt.projectRef||'')+'"></div>'+
    '<div style="margin:12px 0 6px;font-weight:700">Systems</div>'+
    '<div id="qt-systems">'+systemsHtml+'</div>'+
    '<button class="btn" onclick="addQtSys()">+ Add System</button>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'+
      '<button class="btn" onclick="document.getElementById('qt-modal').style.display='none'">Cancel</button>'+
      (!isNew?'<button class="btn btn-r" onclick="deleteQt('+qt.id+');document.getElementById('qt-modal').style.display='none'">🗑️ Delete</button>':'')+
      '<button class="btn btn-p" onclick="saveQtModal()">💾 Save</button>'+
    '</div>';
  
  sv('qf-status', qt.status||'Estimate');
  modal.style.display='flex';
}

function addQtSys(){
  var id=Date.now();
  window._qtEdit.systems.push({id:id,name:'New System',items:[],svcs:[]});
  openQtModal(window._qtEdit);
}
function removeQtSys(si){window._qtEdit.systems.splice(si,1);openQtModal(window._qtEdit);}
function addQtItemManual(si){
  var name=prompt('Item name:');if(!name)return;
  var price=parseFloat(prompt('Price (AED):','0')||0);
  var qty=parseInt(prompt('Qty:','1')||1);
  var items=window._qtEdit.systems[si].items;
  items.push({id:Date.now(),num:(si+1)+'.'+(items.length+1),name:name,qty:qty,price:price,disc:0,vat:5});
  openQtModal(window._qtEdit);
}
function removeQtItem(si,ii){window._qtEdit.systems[si].items.splice(ii,1);openQtModal(window._qtEdit);}
function addQtSvcManual(si){
  var name=prompt('Service name:');if(!name)return;
  var price=parseFloat(prompt('Price (AED):','0')||0);
  var qty=parseInt(prompt('Qty:','1')||1);
  window._qtEdit.systems[si].svcs.push({name:name,qty:qty,price:price});
  openQtModal(window._qtEdit);
}
function removeQtSvc(si,svi){window._qtEdit.systems[si].svcs.splice(svi,1);openQtModal(window._qtEdit);}

function saveQtModal(){
  var clientId=parseInt(gv('qf-client'));
  if(!clientId){showToast('Please select a client','error');return;}
  window._qtEdit.num=gv('qf-num');
  window._qtEdit.date=gv('qf-date');
  window._qtEdit.clientId=clientId;
  window._qtEdit.status=gv('qf-status');
  window._qtEdit.projectRef=gv('qf-projref');
  // Calc total
  var total=0;
  window._qtEdit.systems.forEach(function(sys){
    sys.items.forEach(function(item){total+=(item.qty||1)*(item.price||0)*(1+(parseFloat(item.vat||5)/100));});
    sys.svcs.forEach(function(svc){total+=(svc.qty||1)*(svc.price||0)*1.05;});
  });
  window._qtEdit.total=Math.round(total*100)/100;
  window._qtEdit.savedAt=new Date().toISOString();
  if(window._qtIsNew){SBR.savedQuotations.push(window._qtEdit);}
  else{var idx=SBR.savedQuotations.findIndex(function(q){return q.id===window._qtEdit.id;});if(idx>=0)SBR.savedQuotations[idx]=window._qtEdit;}
  saveAllData();
  document.getElementById('qt-modal').style.display='none';
  renderQuotList();showToast('✅ Quotation saved!');
}

async function main(){
  await initPage('quotations','Quotations',function(){renderQuotList();});
}
window.addEventListener('load',async function(){await main();});
</script>
</body>
</html>
