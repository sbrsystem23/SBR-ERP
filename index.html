<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBR System ERP — Login</title>
<link rel="stylesheet" href="shared.css">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a2f52,#0F4C81,#1e6fb5)}
  .login-card{background:#fff;border-radius:16px;padding:40px 36px;width:400px;max-width:95vw;box-shadow:0 24px 64px rgba(0,0,0,.25)}
  .login-logo{text-align:center;margin-bottom:18px}
  .login-logo img{height:90px;width:auto;object-fit:contain}
  .login-title{font-size:22px;font-weight:800;color:#0F4C81;text-align:center;margin-bottom:4px}
  .login-sub{font-size:12px;color:#6b7280;text-align:center;margin-bottom:28px}
  .login-footer{text-align:center;margin-top:20px;font-size:10px;color:#9ca3af;line-height:1.7}
  .btn-login{width:100%;padding:11px;font-size:14px;margin-top:10px;background:#0F4C81;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;transition:background .15s}
  .btn-login:hover{background:#0d3d6b}
  .err{display:none;background:#fee2e2;color:#dc2626;padding:9px 12px;border-radius:7px;font-size:11px;margin-bottom:12px;text-align:center}
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/logo.png" alt="SBR System">
    </div>
    <div class="login-title">SBR System ERP</div>
    <div class="login-sub">Smart Home & ELV Solutions Provider</div>

    <div id="login-error" class="err">❌ Invalid username or password</div>

    <div class="field">
      <label class="flbl">Username</label>
      <input class="fi" id="username" type="text" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="field" style="margin-bottom:4px">
      <label class="flbl">Password</label>
      <input class="fi" id="password" type="password" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>

    <button class="btn-login" onclick="doLogin()">🔐 Sign In</button>

    <div class="login-footer">
      SBR System Technical Services L.L.C<br>
      ERP Platform 2026 · Dubai, UAE
    </div>
  </div>

<script src="shared.js"></script>
<script>
  if (sessionStorage.getItem('sbr_user')) window.location.href = 'dashboard.html';

  function doLogin() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const err = document.getElementById('login-error');
    err.style.display = 'none';
    if (!u || !p) { err.style.display=''; err.textContent='⚠️ Please enter username and password'; return; }
    if (login(u, p)) {
      window.location.href = 'dashboard.html';
    } else {
      err.style.display = '';
      err.textContent = '❌ Invalid username or password';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }
</script>
</body>
</html>
