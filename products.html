<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBR ERP — Products</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="sidebar-wrap"></div>
<div id="topbar-wrap"></div>
<div class="main">
  <div class="page-hdr">
    <div class="page-title">📦 Product Database</div>
    <button class="btn btn-p" onclick="openForm()">+ Add Product</button>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <input class="search-bar" id="search" placeholder="Search products..." oninput="render()" style="max-width:300px">
    <select class="fi" id="cat-filter" onchange="render()" style="max-width:180px"><option value="">All Categories</option></select>
  </div>
  <div id="list" class="list-wrap"></div>
</div>

<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal" style="max-width:640px">
    <div class="modal-hdr">
      <div class="modal-title" id="modal-title">+ Add Product</div>
      <button onclick="document.getElementById('modal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button>
    </div>
    <div class="fg2">
      <div class="field"><label class="flbl">Product Name *</label><input class="fi" id="pf-name"></div>
      <div class="field"><label class="flbl">Model / Part No.</label><input class="fi" id="pf-model"></div>
    </div>
    <div class="fg2">
      <div class="field"><label class="flbl">Category</label><input class="fi" id="pf-cat" list="cat-list"><datalist id="cat-list"></datalist></div>
      <div class="field"><label class="flbl">Brand</label><input class="fi" id="pf-brand"></div>
    </div>
    <div class="field"><label class="flbl">Description</label><textarea class="fi" id="pf-desc" rows="2"></textarea></div>
    <div class="fg3">
      <div class="field"><label class="flbl">Cost Price (AED)</label><input class="fi" id="pf-cost" type="number" min="0" step="0.01"></div>
      <div class="field"><label class="flbl">Sell Price (AED)</label><input class="fi" id="pf-sell" type="number" min="0" step="0.01"></div>
      <div class="field"><label class="flbl">VAT %</label><input class="fi" id="pf-vat" type="number" value="5" min="0"></div>
    </div>
    <div class="fg2">
      <div class="field"><label class="flbl">Max Discount %</label><input class="fi" id="pf-maxdisc" type="number" min="0" max="100" value="20"></div>
      <div class="field"><label class="flbl">Default Discount %</label><input class="fi" id="pf-defdisc" type="number" min="0" max="100" value="0"></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn" onclick="document.getElementById('modal').style.display='none'">Cancel</button>
      <button class="btn btn-p" onclick="save()">💾 Save</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
window.addEventListener("load",function(){main();});
let editId = null;
async function main() { const ok = await initPage('products','Products'); if(ok) render(); }

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  const cf = document.getElementById('cat-filter');
  const cats = [...new Set(SBR.productDB.map(p=>p.cat||'').filter(Boolean))];
  const curCat = cf.value;
  cf.innerHTML = '<option value="">All Categories</option>' + cats.map(c=>`<option value="${c}"${c===curCat?' selected':''}>${c}</option>`).join('');

  // Populate datalist
  const dl = document.getElementById('cat-list');
  if(dl) dl.innerHTML = cats.map(c=>`<option value="${c}">`).join('');

  const list = SBR.productDB.filter(p => (!q||(p.name||'').toLowerCase().includes(q)||(p.model||'').toLowerCase().includes(q)) && (!cat||p.cat===cat));
  const el = document.getElementById('list');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">No products yet.</div></div>';return;}
  el.innerHTML=`<table class="tbl"><thead><tr><th>Product</th><th>Model</th><th>Category</th><th>Cost</th><th>Sell Price</th><th>Actions</th></tr></thead><tbody>`+
  list.map(p=>`<tr onclick="openForm(${p.id})" style="cursor:pointer">
    <td><div style="font-weight:600">${escH(p.name)}</div>${p.brand?`<div style="font-size:10px;color:var(--text2)">${escH(p.brand)}</div>`:''}</td>
    <td style="font-size:11px">${escH(p.model||'—')}</td>
    <td><span style="background:var(--blue-lt);color:var(--blue);padding:2px 7px;border-radius:8px;font-size:10px">${escH(p.cat||'—')}</span></td>
    <td style="font-size:12px">AED ${fmt(p.cost||0)}</td>
    <td style="font-size:12px;font-weight:700;color:var(--blue)">AED ${fmt(p.sell||0)}</td>
    <td><div style="display:flex;gap:4px">
      <button class="btn btn-xs btn-p" onclick="event.stopPropagation();openForm(${p.id})">✏️</button>
      <button class="btn btn-xs btn-r" onclick="event.stopPropagation();del(${p.id})">✕</button>
    </div></td>
  </tr>`).join('')+'</tbody></table>';
}

function openForm(id) {
  editId=id||null;
  if(id){const p=SBR.productDB.find(x=>x.id===id);if(!p)return;document.getElementById('modal-title').textContent='✏️ Edit Product';sv('pf-name',p.name);sv('pf-model',p.model||'');sv('pf-cat',p.cat||'');sv('pf-brand',p.brand||'');sv('pf-desc',p.desc||'');sv('pf-cost',p.cost||0);sv('pf-sell',p.sell||0);sv('pf-vat',p.vat||5);sv('pf-maxdisc',p.maxDisc||20);sv('pf-defdisc',p.defDisc||0);}
  else{document.getElementById('modal-title').textContent='+ Add Product';['pf-name','pf-model','pf-cat','pf-brand','pf-desc'].forEach(i=>sv(i,''));sv('pf-cost',0);sv('pf-sell',0);sv('pf-vat',5);sv('pf-maxdisc',20);sv('pf-defdisc',0);}
  document.getElementById('modal').style.display='flex';
}

function save() {
  const name=gv('pf-name').trim();if(!name){showToast('Name required','error');return;}
  const obj={name,model:gv('pf-model'),cat:gv('pf-cat'),brand:gv('pf-brand'),desc:gv('pf-desc'),cost:parseFloat(gv('pf-cost'))||0,sell:parseFloat(gv('pf-sell'))||0,vat:parseFloat(gv('pf-vat'))||5,maxDisc:parseFloat(gv('pf-maxdisc'))||20,defDisc:parseFloat(gv('pf-defdisc'))||0};
  if(editId){const p=SBR.productDB.find(x=>x.id===editId);if(p)Object.assign(p,obj);}
  else SBR.productDB.push({id:SBR.pIdCtr++,...obj});
  saveAllData();document.getElementById('modal').style.display='none';render();showToast('✅ Saved!');
}
function del(id){if(!confirm('Delete?'))return;SBR.productDB=SBR.productDB.filter(x=>x.id!==id);saveAllData();render();}
</script>
</body>
</html>
